<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CIRCUIT_RUSH - Gameplay</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#070f12",
                        "error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb2b8",
                        "background": "#0d1518",
                        "on-background": "#dbe4e8",
                        "tertiary-container": "#ffcdd0",
                        "surface-container-high": "#232b2e",
                        "on-primary-fixed": "#002022",
                        "surface-container-highest": "#2e3639",
                        "tertiary": "#fff3f3",
                        "surface-variant": "#2e3639",
                        "on-surface": "#dbe4e8",
                        "surface-container-low": "#151d20",
                        "primary": "#dbfcff",
                        "on-primary-fixed-variant": "#004f54",
                        "outline-variant": "#3b494b",
                        "on-secondary-container": "#626900",
                        "on-secondary-fixed-variant": "#454a00",
                        "error": "#ffb4ab",
                        "inverse-on-surface": "#2a3235",
                        "on-primary": "#00363a",
                        "surface-bright": "#323a3e",
                        "primary-fixed": "#7df4ff",
                        "primary-fixed-dim": "#00dbe9",
                        "surface-tint": "#00dbe9",
                        "surface-dim": "#0d1518",
                        "secondary-container": "#deed00",
                        "on-tertiary-fixed": "#40000f",
                        "on-secondary": "#2f3300",
                        "inverse-primary": "#006970",
                        "on-secondary-fixed": "#1b1d00",
                        "primary-container": "#00f0ff",
                        "secondary-fixed-dim": "#c3d000",
                        "surface-container": "#192124",
                        "on-tertiary-fixed-variant": "#91002d",
                        "on-surface-variant": "#b9cacb",
                        "secondary": "#ffffff",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#006970",
                        "on-error": "#690005",
                        "surface": "#0d1518",
                        "inverse-surface": "#dbe4e8",
                        "on-tertiary-container": "#be003d",
                        "outline": "#849495",
                        "secondary-fixed": "#deed00",
                        "tertiary-fixed": "#ffdadb",
                        "on-tertiary": "#67001d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "container-max": "1200px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "code-sm": ["JetBrains Mono"],
                        "display-mobile": ["Space Grotesk"],
                        "display-lg": ["Space Grotesk"],

                        "body-base": ["Geist"],
                        "label-caps": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "code-sm": ["13px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-mobile": ["32px", { "lineHeight": "1.1", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],

                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom Styles for Cyber-Industrial Aesthetics */
        .neon-glow {
            box-shadow: 0 0 8px var(--tw-colors-primary-container), inset 0 0 4px var(--tw-colors-primary-container);
        }
        .text-glow {
            text-shadow: 0 0 6px var(--tw-colors-primary-container);
        }
        .grid-bg {
            background-image: 
                linear-gradient(to right, #1a2429 1px, transparent 1px),
                linear-gradient(to bottom, #1a2429 1px, transparent 1px);
            background-size: 32px 32px;
        }
        
        /* Pulse Animation */
        @keyframes pulse-signal {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 15px var(--tw-colors-primary-container); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .signal-node {
            animation: pulse-signal 2s infinite ease-in-out;
        }

        /* Blinking Cursor */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor-blink {
            animation: blink 1s step-end infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background overflow-hidden h-screen w-screen flex flex-col font-body-base selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<!-- Suppressed for gameplay focus, replacing with minimal HUD in content area -->
<!-- Main Gameplay Canvas -->
<main class="relative flex-1 w-full h-full flex flex-col items-center justify-center">
<!-- Background Grid -->
<div class="absolute inset-0 grid-bg opacity-40 z-0 pointer-events-none"></div>
<!-- Gameplay HUD (Pinned to corners/top) -->
<div class="absolute top-0 left-0 w-full p-6 z-20 flex justify-between items-start pointer-events-none">
<!-- Left Panel: Score & Level -->
<div class="flex gap-4">
<div class="bg-surface-container-high/60 backdrop-blur-sm border border-outline-variant p-3 flex flex-col gap-1 pointer-events-auto">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">SCORE</span>
<span class="font-code-sm text-code-sm text-primary-fixed text-glow tracking-widest">004500</span>
</div>
<div class="bg-surface-container-high/60 backdrop-blur-sm border border-outline-variant p-3 flex flex-col gap-1 pointer-events-auto">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">LEVEL</span>
<span class="font-code-sm text-code-sm text-secondary-fixed text-glow tracking-widest">04</span>
</div>
</div>
<!-- Right Panel: Lives/Energy -->
<div class="bg-surface-container-high/60 backdrop-blur-sm border border-outline-variant p-3 flex flex-col gap-2 items-end pointer-events-auto">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">SYSTEM_ENERGY</span>
<div class="flex gap-1">
<!-- Energy Bars -->
<div class="w-4 h-6 bg-primary-container neon-glow"></div>
<div class="w-4 h-6 bg-primary-container neon-glow"></div>
<div class="w-4 h-6 bg-primary-container neon-glow"></div>
<!-- Empty Slot -->
<div class="w-4 h-6 border border-outline-variant opacity-50"></div>
</div>
</div>
</div>
<!-- Playfield Area -->
<div class="relative w-full max-w-4xl aspect-[16/9] border border-outline-variant bg-surface-container-lowest/80 backdrop-blur-sm z-10 overflow-hidden flex items-center justify-center">
<!-- Circuit Traces (Decorative) -->
<svg class="absolute inset-0 w-full h-full opacity-20 pointer-events-none" preserveaspectratio="none" viewbox="0 0 100 100">
<path class="text-primary" d="M 0 50 L 30 50 L 40 30 L 60 30 L 70 70 L 100 70" fill="none" stroke="currentColor" stroke-width="0.5"></path>
<path class="text-secondary-fixed" d="M 20 0 L 20 40 L 40 60 L 40 100" fill="none" stroke="currentColor" stroke-width="0.5"></path>
</svg>
<!-- The Signal (Player) -->
<div class="absolute w-6 h-6 bg-primary-container rounded-full signal-node z-30 flex items-center justify-center" style="left: 45%; top: 55%;">
<div class="w-2 h-2 bg-on-primary-fixed rounded-full"></div>
</div>
<!-- Data Nodes (Collectibles/Targets) -->
<div class="absolute w-4 h-4 border border-secondary-fixed rotate-45 z-20" style="left: 60%; top: 30%;"></div>
<div class="absolute w-4 h-4 border border-secondary-fixed rotate-45 z-20" style="left: 30%; top: 70%;"></div>
<!-- Initial State Overlay (Active for demo) -->
<div class="absolute inset-0 bg-background/80 backdrop-blur-md flex flex-col items-center justify-center z-40" id="start-overlay">
<h1 class="font-display-lg text-display-lg text-primary-fixed uppercase mb-8 text-glow tracking-tighter">CIRCUIT_RUSH</h1>
<button class="bg-primary-container text-on-primary-fixed font-label-caps text-label-caps px-8 py-4 uppercase tracking-widest hover:bg-primary-fixed hover:neon-glow transition-all active:scale-95 mb-6 rounded-none">
                    START_SEQUENCE
                </button>
<div class="flex gap-8 text-center">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-on-surface-variant mb-2">keyboard</span>
<span class="font-code-sm text-code-sm text-outline">STEER: ARROWS/WASD</span>
</div>
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-on-surface-variant mb-2">pause_circle</span>
<span class="font-code-sm text-code-sm text-outline">PAUSE: ESC</span>
</div>
</div>
</div>
<!-- Pause Overlay (Hidden by default) -->
<div class="hidden absolute inset-0 bg-background/90 backdrop-blur-md flex flex-col items-center justify-center z-50" id="pause-overlay">
<h2 class="font-headline-md text-headline-md text-secondary-fixed uppercase mb-2 tracking-widest">SYS_PAUSED</h2>
<div class="font-code-sm text-code-sm text-outline mb-8">SESSION_YIELD: 004500</div>
<div class="flex gap-4">
<button class="border border-primary-container text-primary-container font-label-caps text-label-caps px-6 py-3 uppercase tracking-widest hover:bg-primary-container/10 transition-all rounded-none">
                        RESUME_LINK
                    </button>
<button class="border border-outline-variant text-on-surface-variant font-label-caps text-label-caps px-6 py-3 uppercase tracking-widest hover:text-primary hover:border-primary transition-all rounded-none">
                        ABORT_RUN
                    </button>
</div>
</div>
</div>
<!-- Bottom Controls / Status (Pinned to bottom) -->
<div class="absolute bottom-0 w-full p-4 z-20 flex justify-between items-end pointer-events-none">
<div class="font-code-sm text-code-sm text-outline-variant flex items-center gap-2">
<span class="w-2 h-2 bg-secondary-fixed rounded-full inline-block"></span>
                LINK_STABLE
            </div>
<div class="font-code-sm text-code-sm text-outline-variant">
                CORE_VER_1.0.2 <span class="cursor-blink">_</span>
</div>
</div>
</main>
<!-- SideNavBar & Footer Suppressed for Gameplay Canvas Focus -->
<script>
        // Simple interactions for demonstration purposes
        document.addEventListener('DOMContentLoaded', () => {
            const startOverlay = document.getElementById('start-overlay');
            const pauseOverlay = document.getElementById('pause-overlay');
            const startBtn = startOverlay.querySelector('button');

            // Start Game
            startBtn.addEventListener('click', () => {
                startOverlay.classList.add('hidden');
                // Initiate gameplay loop here...
            });

            // Toggle Pause on ESC
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && startOverlay.classList.contains('hidden')) {
                    pauseOverlay.classList.toggle('hidden');
                    pauseOverlay.classList.toggle('flex');
                }
            });

            // Resume button
            const resumeBtn = pauseOverlay.querySelector('button');
            resumeBtn.addEventListener('click', () => {
                pauseOverlay.classList.add('hidden');
                pauseOverlay.classList.remove('flex');
            });
        });
    </script>
</body></html>
